[package]
name = "claude-ssh-wrapper"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Drop-in replacement for the Claude Code CLI that runs it as another local Windows user via SSH"
license = "MIT"
publish = false

[[bin]]
name = "claude-ssh"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
humantime = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# serde_yaml is archived/unmaintained; serde_yaml_ng is a maintained fork with the same API.
serde_yaml_ng = "0.10"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true

[build-dependencies]
winresource = "0.1.34"
